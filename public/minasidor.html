<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mina sidor – Vanessas Däck</title>
<link rel="stylesheet" href="/public/styles.css?v=5">
<link rel="icon" href="/public/logo.svg">
<style>
  .order-card { background: #fff; border: 1px solid #dde5ea; border-radius: 10px; padding: 16px 20px; margin-bottom: 16px; }
  .oc-head { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; font-weight: 700; margin-bottom: 8px; }
  .oc-line { display: flex; justify-content: space-between; font-size: 14px; padding: 2px 0; color: #444; }
  .oc-items { margin: 8px 0; border-top: 1px dashed #dde5ea; padding-top: 8px; font-size: 14px; }
  .oc-total { font-weight: 700; font-size: 16px; margin-top: 6px; }
  .badge { display: inline-block; border-radius: 4px; padding: 2px 10px; font-size: 13px; font-weight: 600; }
  .b-new { background: #fff3e0; color: #b26a00; }
  .b-handled { background: #e3f6e5; color: #1c7a2d; }
</style>
</head>
<body class="page account-page">
<header id="site-header"></header>
<main class="container narrow">
  <div id="notLogged" style="display:none">
    <h1>Mina sidor</h1>
    <p class="lead">Du måste logga in för att se dina beställningar.</p>
    <p><a class="btn" href="/logga-in?next=/mina-sidor">Logga in</a> eller <a class="btn btn-ghost" href="/skapa-konto">Skapa konto</a></p>
  </div>
  <div id="logged" style="display:none">
    <h1>Hej, <span id="userName"></span>!</h1>
    <p class="lead" id="userEmail"></p>
    <h2 style="margin-top:24px">Mina beställningar</h2>
    <div id="orders" style="margin-top:12px">
      <p class="muted">Laddar beställningar...</p>
    </div>
    <p style="margin-top:20px"><button class="btn btn-ghost" onclick="doLogout()">Logga ut</button></p>
  </div>
</main>
<footer id="site-footer"></footer>
<script src="/public/app.js?v=5"></script>
<script>
function esc(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }

async function init() {
  let user = null;
  try {
    const r = await fetch('/api/me');
    if (r.ok) user = (await r.json()).user;
  } catch (e) {}
  document.getElementById('notLogged').style.display = user ? 'none' : 'block';
  document.getElementById('logged').style.display = user ? 'block' : 'none';
  if (!user) return;
  document.getElementById('userName').textContent = user.name;
  document.getElementById('userEmail').textContent = user.email;

  try {
    const r = await fetch('/api/my-orders');
    const d = await r.json();
    const box = document.getElementById('orders');
    if (!d.orders || !d.orders.length) {
      box.innerHTML = '<p class="muted">Du har inga beställningar ännu.</p>';
      return;
    }
    box.innerHTML = d.orders.map(o => {
      const items = o.items.map(i => `<div class="oc-line"><span>${esc(i.qty)} × ${esc(i.manufacturer || '')} ${esc(i.name)}</span><span>${(i.price * i.qty).toLocaleString('sv-SE')} kr</span></div>`).join('');
      const badge = o.status === 'handled' ? '<span class="badge b-handled">Behandlad</span>' : '<span class="badge b-new">Ny</span>';
      return `<div class="order-card">
        <div class="oc-head"><span>${esc(o.id)}</span><span>${badge}</span></div>
        <div class="oc-line"><span>${new Date(o.created).toLocaleString('sv-SE')}</span><span>${esc(o.shipping.method)} · ${esc(o.payment.method)}</span></div>
        <div class="oc-items">${items}</div>
        <div class="oc-total">Totalt: ${o.total.toLocaleString('sv-SE')} kr</div>
      </div>`;
    }).join('');
  } catch (e) {
    document.getElementById('orders').innerHTML = '<p class="muted">Kunde inte hämta beställningar.</p>';
  }
}

async function doLogout() {
  await fetch('/api/logout', { method: 'POST' });
  location.href = '/';
}

injectHeader();
APP.initAccount();
init();
</script>
</body>
</html>
