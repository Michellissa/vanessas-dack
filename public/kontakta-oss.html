<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kontakta oss – Vanessas Däck</title>
<link rel="stylesheet" href="/public/styles.css?v=7">
<link rel="icon" href="/public/logo.svg">
</head>
<body>
<header id="site-header" class="site"></header>
<div class="container">
  <div class="breadcrumbs"><a href="/">Hem</a><span class="sep">›</span><span>Kontakta oss</span></div>
  <section class="block">
    <div class="container">
      <h2 class="sec">Kontakta oss</h2>
      <p class="sec-sub">Vi svarar normalt inom 24 timmar</p>
      <div class="cats">
        <div class="cat"><div class="info"><h3 class="with-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>Telefon</h3><p id="kontakt-hours">Ring oss på vardagar 9–17.</p></div></div>
        <div class="cat"><div class="info"><h3 class="with-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="M22 7l-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path></svg>E-post</h3><p>Skicka dina frågor så hjälper vi dig så snart vi kan.</p></div></div>
        <div class="cat"><div class="info"><h3 class="with-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>Besök oss</h3><p>Vi säljer och monterar däck och fälgar. Välkommen in!</p></div></div>
      </div>
    </div>
  </section>
</div>
<footer id="site-footer"></footer>
<script src="/public/app.js?v=7"></script>
<script>injectHeader('');
APP.getSettings().then(s => {
  const el = document.getElementById('kontakt-hours');
  if (el && s.openingHours) el.textContent = 'Ring oss på ' + s.openingHours.toLowerCase() + '.';
});</script>
</body>
</html>
